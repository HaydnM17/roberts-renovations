<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Roberts Renovations</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml">
<style>
  @font-face{font-family:"Bricolage Grotesque";src:url("/fonts/bricolage-grotesque-800.woff2") format("woff2");font-weight:800;font-style:normal;font-display:swap}
  @font-face{font-family:"IBM Plex Sans";src:url("/fonts/ibm-plex-sans-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"IBM Plex Mono";src:url("/fonts/ibm-plex-mono-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}

  :root{
    --ground:#151513;
    --text:#F3F1EA;
    --accent:#EDB51C;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{color-scheme:dark}
  body{
    margin:0;
    min-height:100svh;
    display:grid;
    place-content:center;
    background:var(--ground);
    color:var(--text);
    font:400 17px/1.6 "IBM Plex Sans",Arial,sans-serif;
    text-align:center;
  }
  main{
    max-width:34rem;
    padding:2rem;
    display:grid;
    gap:1.25rem;
    justify-items:center;
  }
  .kicker{
    margin:0;
    font:500 13px/1 "IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
  }
  h1{
    margin:0;
    font:800 clamp(1.8rem,5vw,2.6rem)/1.15 "Bricolage Grotesque","Arial Black",sans-serif;
  }
  p{margin:0;color:var(--text)}
  .links{
    display:flex;
    flex-wrap:wrap;
    gap:.75rem;
    justify-content:center;
    margin-top:.5rem;
  }
  a.btn{
    display:inline-block;
    padding:.85rem 1.5rem;
    border-radius:2px;
    text-decoration:none;
    font:600 14px/1 "IBM Plex Sans",Arial,sans-serif;
  }
  a.btn-primary{background:var(--accent);color:var(--ground)}
  a.btn-ghost{border:1px solid var(--text);color:var(--text)}
  a.btn:focus-visible,a.btn-ghost:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<!--
  Shipping this file switches Cloudflare Pages out of single-page fallback mode: unknown paths get
  this page with a real 404 instead of index.html with a 200.
-->
<main>
  <p class="kicker">404</p>
  <h1>That page is not here</h1>
  <p>The link may be old or the address mistyped.</p>
  <div class="links">
    <a class="btn btn-primary" href="/">Back to the home page</a>
    <a class="btn btn-ghost" href="tel:+19058696353">Call (905) 869-6353</a>
  </div>
</main>
</body>
</html>
